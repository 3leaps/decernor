# yamllint disable rule:document-start
# yamllint disable rule:truthy
# yamllint disable rule:line-length
name: CI
# Pull-request verification runs this workflow unchanged from the release tip.
on:
  push:
    branches: [main]
  pull_request:
# The goneat-tools-runner image owns Go, goneat, golangci-lint, and foundation
# formatters. Security scanners are installed later at exact versions because
# they are not bundled; they must not shadow image-owned build tools.
defaults:
  run:
    # Container run: steps use the image's /bin/sh, which is `dash` here.
    # Force bash so `set -euo pipefail` and friends work.
    shell: bash
jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      # glibc runner is the default; a `-musl` variant exists for Alpine.
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.8@sha256:a64b0319f4aad1069f2edd587f9d4d7bf2c52318c3c3e0c9d88650c5983c9c77
      # actions/checkout needs write access to
      # /__w/_temp/_runner_file_commands/.
      options: --user root
    env:
      # CI-only boundary hint for gofulmen/pathfinder repo-root discovery
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      # Sibling of the workspace, so repository scans never see the corpus.
      DECERNOR_SYNTHCORPUS_ROOT: ${{ github.workspace }}/../synthcorpus
      # Must equal the commit in testdata/synthcorpus.pin; the test harness
      # fails if the checkout does not match the pin.
      SYNTHCORPUS_COMMIT: c479d6669cd5045c2623d8970fe5871bdd7fcfc7
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout fixture corpus (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: 3leaps/synthcorpus
          ref: ${{ env.SYNTHCORPUS_COMMIT }}
          path: synthcorpus-checkout
          persist-credentials: false
      - name: Move fixture corpus beside the workspace
        run: mv synthcorpus-checkout "${DECERNOR_SYNTHCORPUS_ROOT}"
      - name: Setup (temp perms + git safe.directory)
        run: |
          set -euo pipefail
          install -d -m 0777 /__w/_temp || true
          install -d -m 0777 /__w/_temp/_runner_file_commands || true
          chown -R "$(id -u)":"$(id -g)" /__w/_temp || true
          chmod -R 777 /__w/_temp || true
          # Avoid git "dubious ownership" on the container-owned checkout, which
          # breaks Go VCS stamping and any `git` call in the Makefile.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "$(realpath "${DECERNOR_SYNTHCORPUS_ROOT}")"
      - name: Verify toolchain (no installs)
        run: |
          set -euo pipefail
          echo "=== Bundled toolchain (from image) ==="
          go version
          goneat --version
          golangci-lint version
          prettier --version
          yamlfmt --version
          # The go.mod directive and image use the same exact Go patch.
          go version | grep -q 'go1\.26\.9 ' || {
            echo "::error::Need Go 1.26.9 from runner image; got $(go version)"
            exit 1
          }
      - name: Verify embedded identity mirror
        run: make verify-embedded-identity
      - name: Download modules
        run: go mod download
      - name: Security and license gates (pinned, fail closed)
        run: make security-gates
      - name: Format check (non-mutating)
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build binary
        run: make build
      - name: Standalone binary works outside repo
        run: make test-standalone-binary
